name: Build Syncthing

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release (e.g. v1.29.0)"
        required: false
        default: ""
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.jobs.output }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs:
          - { goos: linux, goarch: arm64, output: arm64, cc: "zig cc -target aarch64-linux-musl" }
          - { goos: linux, goarch: arm, goarm: '7', output: armv7, cc: "zig cc -target arm-linux-musleabihf -mcpu=generic+v7a" }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.26.0'
          cache: true

      - name: Set up Zig (CGO Cross Compiler)
        uses: mlugg/setup-zig@v2

      - name: Set version variables
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v2.1.3-custom")
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building Syncthing version: ${VERSION}"

      - name: Install Official UPX
        run: |
          echo "Downloading official UPX release..."
          curl -sL https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz | tar -xJ --strip-components=1 -C /usr/local/bin upx-4.2.4-amd64_linux/upx
          upx --version

      - name: Build Web GUI assets
        shell: bash
        run: |
          echo "=== 1. Building Web GUI static assets ==="
          # Generate GUI static assets on the host cleanly without CGO / cross-compiler interference
          CGO_ENABLED=0 go run script/genassets.go -o lib/api/auto/gui.files.go gui

      - name: Compile Syncthing binary
        shell: bash
        run: |
          echo "=== 2. Compiling Syncthing binary ==="
          export GOOS="${{ matrix.jobs.goos }}"
          export GOARCH="${{ matrix.jobs.goarch }}"
          if [ -n "${{ matrix.jobs.goarm }}" ]; then
            export GOARM="${{ matrix.jobs.goarm }}"
          fi
          export CGO_ENABLED=1
          export CC="${{ matrix.jobs.cc }}"

          # Direct go build targeting router architecture with static musl CGO
          go build -v -trimpath \
            -tags "noupgrade noquic sqlite_omit_load_extension sqlite_dbstat netgo osusergo" \
            -ldflags "-w -s -buildid= -linkmode=external -extldflags=-static \
              -X github.com/syncthing/syncthing/lib/build.Version=${VERSION} \
              -X github.com/syncthing/syncthing/lib/build.Stamp=$(date +%s) \
              -X github.com/syncthing/syncthing/lib/build.User=builder \
              -X github.com/syncthing/syncthing/lib/build.Host=github \
              -X github.com/syncthing/syncthing/lib/build.Tags=noupgrade,noquic,sqlite_omit_load_extension,sqlite_dbstat,netgo,osusergo" \
            -o syncthing ./cmd/syncthing

          echo "=== 3. Compressing with Official UPX LZMA ==="
          echo "Binary size before compression:"
          ls -lh syncthing
          upx --best --lzma -v syncthing
          echo "Binary size after compression:"
          ls -lh syncthing

          echo "=== 4. Packaging ==="
          OUT_NAME="syncthing-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}-${VERSION}"
          mv syncthing "${OUT_NAME}"
          ls -lh "${OUT_NAME}"

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "syncthing-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          path: |
            syncthing-*

  Release:
    name: Create GitHub Release
    permissions: write-all
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') || startsWith(github.ref, 'refs/tags/v') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Set Release Tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: bin/*
          draft: false
          prerelease: false

